name: Daily Update Fund Data

on:
  # Schedule: Mon-Fri, every ~30 min from 19:37 to 23:37 Beijing time.
  # GitHub's scheduler not only delays runs for HOURS under load, it sometimes
  # DROPS dispatches entirely (observed 2026-07-29/30, incl. off-peak minutes).
  # So we cast a dense net of 9 fires per evening; a guard step checks whether
  # today's data is already in place and skips ALL remaining steps, making every
  # extra fire a ~30-second no-op (one checkout + one grep, zero Tushare calls).
  schedule:
    - cron: '37 11 * * 1-5'   # 19:37 Beijing
    - cron: '7 12 * * 1-5'    # 20:07
    - cron: '37 12 * * 1-5'   # 20:37
    - cron: '7 13 * * 1-5'    # 21:07
    - cron: '37 13 * * 1-5'   # 21:37
    - cron: '7 14 * * 1-5'    # 22:07
    - cron: '37 14 * * 1-5'   # 22:37
    - cron: '7 15 * * 1-5'    # 23:07
    - cron: '37 15 * * 1-5'   # 23:37
  # Code pushes only rebuild & deploy the site; they do NOT re-fetch data
  push:
    branches: [main]
  # Manual trigger via GitHub web interface (fetches data + deploys)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    name: Fetch Data & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if today's data is already updated (Beijing date)
        if: github.event_name == 'schedule'
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          if grep -q "$TODAY" public/fund_data.json; then
            echo "Data for $TODAY already present, skipping fetch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Data for $TODAY missing, will fetch."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        run: |
          pip install tushare pandas requests

      - name: Fetch data from Tushare
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/update_data.py

      - name: Copy updated data to public
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        run: cp src/data/fund_data.json public/fund_data.json

      - name: Commit updated data back to repo
        if: github.event_name != 'push' && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/fund_data.json public/fund_data.json scripts/cache/sector_history.json scripts/cache/margin_history.json
          git diff --cached --quiet || git commit -m "data: 自动更新资金数据 $(date +'%Y-%m-%d')"
          git push || true

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Build project
        if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: Setup Pages
        if: steps.guard.outputs.skip != 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
